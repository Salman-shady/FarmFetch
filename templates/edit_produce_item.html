{% extends "base.html" %}

{% block title %}Edit Produce - {{ item.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="dashboard-card shadow-sm">
            <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
                <div class="farm-avatar" style="width: 48px; height: 48px; font-size: 1.5rem;">
                    <i class="bi bi-pencil-square"></i>
                </div>
                <div>
                    <h3 class="fw-bold mb-0 text-dark">Edit Produce Item</h3>
                    <p class="text-muted small mb-0">{{ item.name }}</p>
                </div>
            </div>
            
            <form method="POST">
                <div class="row g-3 mb-3">
                    <div class="col-md-7">
                        <label for="name" class="form-label">Item Name</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ item.name }}" required>
                    </div>
                    <div class="col-md-5">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select" id="category" name="category">
                            {% set cur_cat = item.category or 'Other' %}
                            <option value="Vegetables" {% if cur_cat == 'Vegetables' %}selected{% endif %}>Vegetables</option>
                            <option value="Fruits" {% if cur_cat == 'Fruits' %}selected{% endif %}>Fruits</option>
                            <option value="Dairy" {% if cur_cat == 'Dairy' %}selected{% endif %}>Dairy</option>
                            <option value="Grains" {% if cur_cat == 'Grains' %}selected{% endif %}>Grains</option>
                            <option value="Herbs" {% if cur_cat == 'Herbs' %}selected{% endif %}>Herbs</option>
                            <option value="Other" {% if cur_cat == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="2">{{ item.description }}</textarea>
                </div>

                <!-- Image URL & Live Preview -->
                <div class="row g-3 mb-3">
                    <div class="col-md-9">
                        <label for="image_url" class="form-label d-flex justify-content-between align-items-center">
                            <span>Image URL</span>
                            <span class="text-muted small" style="font-size:0.75rem;">Clear photo makes it easier to sell</span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-image"></i></span>
                            <input type="url" class="form-control border-start-0 ps-0" id="image_url" name="image_url" value="{{ item.image_url if item.image_url else '' }}" placeholder="https://images.unsplash.com/... or paste image URL">
                        </div>
                        <div class="mt-1 d-flex flex-wrap gap-1 align-items-center">
                            <small class="text-muted" style="font-size:0.75rem;">Sample photos:</small>
                            <button type="button" class="btn btn-light btn-sm py-0 px-1 border chip-img-sample" data-url="https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=500" data-cat="Vegetables" data-name="Organic Red Tomatoes" style="font-size:0.75rem;">🍅 Tomatoes</button>
                            <button type="button" class="btn btn-light btn-sm py-0 px-1 border chip-img-sample" data-url="https://images.unsplash.com/photo-1550583724-b2692b85b150?w=500" data-cat="Dairy" data-name="Pure Farm Fresh Milk" style="font-size:0.75rem;">🥛 Milk</button>
                            <button type="button" class="btn btn-light btn-sm py-0 px-1 border chip-img-sample" data-url="https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=500" data-cat="Fruits" data-name="Crisp Apples" style="font-size:0.75rem;">🍎 Apples</button>
                            <button type="button" class="btn btn-light btn-sm py-0 px-1 border chip-img-sample" data-url="https://images.unsplash.com/photo-1576045057995-568f588f82fb?w=500" data-cat="Vegetables" data-name="Fresh Baby Spinach" style="font-size:0.75rem;">🥬 Spinach</button>
                            <button type="button" class="btn btn-light btn-sm py-0 px-1 border chip-img-sample" data-url="https://images.unsplash.com/photo-1598170845058-32b9d6a5c317?w=500" data-cat="Vegetables" data-name="Organic Carrots" style="font-size:0.75rem;">🥕 Carrots</button>
                            <button type="button" class="btn btn-light btn-sm py-0 px-1 border chip-img-sample" data-url="https://images.unsplash.com/photo-1582722872445-44dc5f7e3c8f?w=500" data-cat="Dairy" data-name="Farm Fresh Eggs" style="font-size:0.75rem;">🥚 Eggs</button>
                            <button type="button" class="btn btn-light btn-sm py-0 px-1 border chip-img-sample" data-url="https://images.unsplash.com/photo-1587049352846-4a222e784d38?w=500" data-cat="Other" data-name="Raw Wildflower Honey" style="font-size:0.75rem;">🍯 Honey</button>
                        </div>
                    </div>
                    <div class="col-md-3 d-flex flex-column align-items-center justify-content-center">
                        <label class="form-label small text-muted mb-1">Preview</label>
                        <div id="img-preview-box" class="border rounded-3 d-flex align-items-center justify-content-center bg-light" style="width: 72px; height: 72px; overflow: hidden;">
                            <i class="bi bi-image text-muted fs-3" id="img-preview-icon"></i>
                            <img id="img-preview-tag" src="{{ item.image_url if item.image_url else '' }}" alt="Preview" class="{% if not item.image_url %}d-none{% endif %} w-100 h-100" style="object-fit: cover;">
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <label for="price" class="form-label fw-semibold">Price (₹)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted fw-bold">₹</span>
                            <input type="number" step="0.01" class="form-control ps-0 border-start-0" id="price" name="price" value="{{ item.price }}" required min="0.01">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="unit" class="form-label fw-semibold mb-0">Unit of Measure</label>
                            <span id="unit-auto-badge" class="badge bg-success-subtle text-success border border-success-subtle py-1 px-2" style="font-size:0.7rem;">
                                <i class="bi bi-check2-circle me-1"></i>Current: {{ item.unit }}
                            </span>
                        </div>
                        <input type="text" class="form-control" id="unit" name="unit" value="{{ item.unit }}" required placeholder="e.g., per kg, per liter, per bunch">
                        <div class="mt-1 d-flex flex-wrap gap-1 align-items-center">
                            <small class="text-muted" style="font-size:0.72rem;">Quick units:</small>
                            <button type="button" class="btn btn-light btn-sm py-0 px-1 border chip-unit-select" data-unit="per kg" style="font-size:0.75rem;">per kg</button>
                            <button type="button" class="btn btn-light btn-sm py-0 px-1 border chip-unit-select" data-unit="per liter" style="font-size:0.75rem;">per liter</button>
                            <button type="button" class="btn btn-light btn-sm py-0 px-1 border chip-unit-select" data-unit="per dozen" style="font-size:0.75rem;">per dozen</button>
                            <button type="button" class="btn btn-light btn-sm py-0 px-1 border chip-unit-select" data-unit="per bunch" style="font-size:0.75rem;">per bunch</button>
                            <button type="button" class="btn btn-light btn-sm py-0 px-1 border chip-unit-select" data-unit="per piece" style="font-size:0.75rem;">per piece</button>
                            <button type="button" class="btn btn-light btn-sm py-0 px-1 border chip-unit-select" data-unit="per 500g" style="font-size:0.75rem;">per 500g</button>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label for="stock" class="form-label fw-semibold">Available Stock</label>
                        <input type="number" class="form-control" id="stock" name="stock" value="{{ item.stock if item.stock is not none else 20 }}" min="0" placeholder="e.g., 20">
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1">
                        <i class="bi bi-check2"></i> Save Changes
                    </button>
                    <a href="{{ url_for('manage_produce') }}" class="btn btn-secondary px-4">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    'use strict';
    const nameInput = document.getElementById('name');
    const categorySelect = document.getElementById('category');
    const unitInput = document.getElementById('unit');
    const autoBadge = document.getElementById('unit-auto-badge');
    const imgInput = document.getElementById('image_url');
    const previewIcon = document.getElementById('img-preview-icon');
    const previewTag = document.getElementById('img-preview-tag');
    const unitChips = document.querySelectorAll('.chip-unit-select');

    let userHasManuallyEditedUnit = true; // In edit form, default item unit is preserved unless category or quick unit is changed

    // Automatic unit inference rule engine
    function inferUnit(name, category) {
        const n = (name || '').toLowerCase().trim();
        const c = (category || '').toLowerCase().trim();

        // 1. Liquids / Dairy liquids -> per liter
        if (/\b(milk|doodh|curd|dahi|yogurt|lassi|buttermilk|chaas|juice|oil|liquid|ghee|shake)\b/i.test(n)) {
            return 'per liter';
        }
        // 2. Eggs -> per dozen
        if (/\b(egg|eggs|anda|ande)\b/i.test(n)) {
            return 'per dozen';
        }
        // 3. Leafy greens / herbs -> per bunch
        if (/\b(spinach|palak|coriander|cilantro|dhaniya|methi|fenugreek|mint|pudina|kale|lettuce|bunch|parsley|basil|herbs?)\b/i.test(n)) {
            return 'per bunch';
        }
        // 4. Whole pieces
        if (/\b(coconut|watermelon|pumpkin|cabbage|cauliflower|pineapple|papaya|piece|kaddu)\b/i.test(n)) {
            return 'per piece';
        }
        // 5. Honey / jam / jar products
        if (/\b(honey|jam|pickle|achar|marmalade)\b/i.test(n)) {
            return 'per 500g jar';
        }
        // 6. Common Vegetables / Fruits / Grains keywords
        if (/\b(tomato|potato|onion|apple|banana|mango|carrot|rice|wheat|flour|atta|dal|grain|vegetable|fruit)\b/i.test(n)) {
            return 'per kg';
        }

        // Category-based defaults
        if (c === 'dairy') {
            return 'per liter';
        }
        if (c === 'herbs') {
            return 'per bunch';
        }
        if (c === 'vegetables' || c === 'fruits' || c === 'grains') {
            return 'per kg';
        }
        return 'per kg';
    }

    function syncAutoUnit() {
        const inferred = inferUnit(nameInput.value, categorySelect.value);
        unitInput.value = inferred;
        if (autoBadge) {
            autoBadge.innerHTML = '<i class="bi bi-magic me-1"></i>Auto: ' + inferred;
            autoBadge.className = 'badge bg-success-subtle text-success border border-success-subtle py-1 px-2';
        }
        highlightActiveChip(inferred);
    }

    function highlightActiveChip(val) {
        unitChips.forEach(chip => {
            if (chip.dataset.unit === val) {
                chip.classList.add('bg-success', 'text-white', 'border-success');
                chip.classList.remove('btn-light');
            } else {
                chip.classList.remove('bg-success', 'text-white', 'border-success');
                chip.classList.add('btn-light');
            }
        });
    }

    if (categorySelect) {
        categorySelect.addEventListener('change', function() {
            userHasManuallyEditedUnit = false;
            syncAutoUnit();
        });
    }

    if (nameInput) {
        nameInput.addEventListener('input', function() {
            if (!userHasManuallyEditedUnit) {
                syncAutoUnit();
            }
        });
    }

    if (unitInput) {
        unitInput.addEventListener('input', function() {
            userHasManuallyEditedUnit = true;
            if (autoBadge) {
                autoBadge.innerHTML = '<i class="bi bi-pencil me-1"></i>Custom Unit';
                autoBadge.className = 'badge bg-secondary-subtle text-secondary border py-1 px-2';
            }
            highlightActiveChip(unitInput.value);
        });
    }

    unitChips.forEach(chip => {
        chip.addEventListener('click', function() {
            unitInput.value = this.dataset.unit;
            userHasManuallyEditedUnit = false;
            if (autoBadge) {
                autoBadge.innerHTML = '<i class="bi bi-check2-circle me-1"></i>Selected: ' + this.dataset.unit;
                autoBadge.className = 'badge bg-primary-subtle text-primary border border-primary-subtle py-1 px-2';
            }
            highlightActiveChip(this.dataset.unit);
        });
    });

    function updatePreview() {
        const url = imgInput.value.trim();
        if (url) {
            previewTag.src = url;
            previewTag.onload = () => {
                previewTag.classList.remove('d-none');
                previewIcon.classList.add('d-none');
            };
            previewTag.onerror = () => {
                previewTag.classList.add('d-none');
                previewIcon.classList.remove('d-none');
            };
        } else {
            previewTag.classList.add('d-none');
            previewIcon.classList.remove('d-none');
        }
    }

    // Initial check on load
    if (imgInput.value.trim()) {
        updatePreview();
    }
    highlightActiveChip(unitInput.value);

    imgInput.addEventListener('input', updatePreview);
    imgInput.addEventListener('change', updatePreview);

    document.querySelectorAll('.chip-img-sample').forEach(btn => {
        btn.addEventListener('click', () => {
            imgInput.value = btn.dataset.url;
            if (btn.dataset.cat && categorySelect) {
                categorySelect.value = btn.dataset.cat;
            }
            if (btn.dataset.name && nameInput) {
                nameInput.value = btn.dataset.name;
            }
            userHasManuallyEditedUnit = false;
            syncAutoUnit();
            updatePreview();
        });
    });
})();
</script>
{% endblock %}
